[build]
  base = "SharpHaus-Creative-NextJS-NodeJS-Firebase/sharphaus/frontend"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["firebase-admin", "nodemailer"]

[[plugins]]
  package = "@netlify/plugin-nextjs"
